services:
  postgres:
    image: pgvector/pgvector:pg15   # postgres:15 + pgvector preinstalled — migration 0001 runs `CREATE EXTENSION "vector"`
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tender:tender@postgres:5432/tender_platform
      S3_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Two worker pools, not one (docs/DECISIONS.md #47): map/reduce/ingestion are real
  # Ollama calls, measured (9 real chunks, 2 real documents) at ~6-135s each with
  # per-call latency degrading under concurrent load — concurrency=4 balances real
  # throughput against that degradation and free-tier rate-limit risk. Chunk-building
  # has no LLM call and must never queue behind a slow "llm" task for a shared slot.
  celery-worker-llm:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q llm --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tender:tender@postgres:5432/tender_platform
      S3_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery-worker-default:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default --concurrency=8
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tender:tender@postgres:5432/tender_platform
      S3_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
