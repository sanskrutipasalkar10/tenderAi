services:
  postgres:
    image: pgvector/pgvector:pg15   # postgres:15 + pgvector preinstalled — migration 0001 runs `CREATE EXTENSION "vector"`
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tender:tender@postgres:5432/tender_platform
      S3_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
      # Both the dockerized frontend (below, host port 3002) and a locally-run
      # `npm run dev` frontend (host port 3000) need to be allowed — found for real
      # (docs/DECISIONS.md #56) that a missing entry here silently blocks every
      # browser request with no server-side error to debug from.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-visible (baked in at build time, not a secret) — the browser talks
        # to the API at this host-mapped address, not api:8000 (docker-internal,
        # unreachable from the host's browser).
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3000"
    depends_on:
      - api

  # Two worker pools, not one (docs/DECISIONS.md #47): map/reduce/ingestion are real
  # Ollama calls, measured (9 real chunks, 2 real documents) at ~6-135s each with
  # per-call latency degrading under concurrent load — concurrency=4 balances real
  # throughput against that degradation and free-tier rate-limit risk. Chunk-building
  # has no LLM call and must never queue behind a slow "llm" task for a shared slot.
  celery-worker-llm:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q llm --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tender:tender@postgres:5432/tender_platform
      S3_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery-worker-default:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default --concurrency=8
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tender:tender@postgres:5432/tender_platform
      S3_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Self-hosted Langfuse (docs/DECISIONS.md #52) — asked of and confirmed by the user:
  # traces carry real prompt content (real tender text), so this stays local rather
  # than going through Langfuse Cloud. Its own Postgres instance, separate from the
  # app's — keeps trace data (and any future Langfuse schema migrations) fully
  # decoupled from tender_platform's own database.
  langfuse-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2   # pinned to v2 — matches the langfuse==2.57.1 Python SDK
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      # Dev-only placeholders (same "change-me-in-every-environment" convention as
      # JWT_SECRET_KEY/AUTH_PASSWORD_HASH) — a real deployment overrides both via its
      # own .env, never commits real values.
      NEXTAUTH_SECRET: change-me-in-every-environment
      SALT: change-me-in-every-environment
    depends_on:
      langfuse-postgres:
        condition: service_healthy

  # Real per-task/per-queue Celery metrics (docs/DECISIONS.md #54) — consumes the task
  # events celery_app.py now emits (worker_send_task_events) directly off the Redis
  # broker and exposes them as Prometheus metrics. Deliberately NOT custom
  # prometheus_client instrumentation inside the worker processes: Celery's prefork
  # pool runs multiple OS processes per worker, which needs prometheus_client's
  # multiprocess mode to do correctly — a well-known sharp edge, and this
  # purpose-built, actively maintained exporter avoids it entirely.
  celery-exporter:
    image: danihodovic/celery-exporter
    command: ["--broker-url=redis://redis:6379/0"]
    ports:
      - "9808:9808"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
      - celery-exporter

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  langfuse_postgres_data:
