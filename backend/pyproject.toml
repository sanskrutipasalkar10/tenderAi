[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP017 (datetime.UTC alias): CI/Docker target 3.11 (target-version above), but local
# dev on this machine happens to run 3.10, where datetime.UTC doesn't exist. Keeping
# code on timezone.utc (valid on every version) avoids a real ImportError locally for
# a purely cosmetic lint preference.
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom (`= Depends(...)` as a default) is the intended
# pattern, not the mutable-default-argument bug B008 detects.
"app/api/*.py" = ["B008"]
# Data-authoring script: fixture/tuple literals read better unwrapped than reflowed.
"scripts/build_eval_set.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
